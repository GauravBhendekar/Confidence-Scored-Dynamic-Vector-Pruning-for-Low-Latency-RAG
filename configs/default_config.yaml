system:
  project_name: "QATM-RAG"
  environment: "development"
  log_level: "INFO"
  seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_eval: "data/evaluation"
  chroma_db: "data/chroma_db"
  logs: "logs"
  results: "results"

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  batch_size: 32
  device: "cuda"

llm:
  provider: "llama_cpp"
  # Preference order: GGUF via llama-cpp-python, then a local Ollama server,
  # then a deterministic extractive fallback (not valid for benchmarking).
  model_path: "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
  ollama_host: "http://localhost:11434"
  ollama_model: "llama3.2"
  prefer_ollama: false
  n_ctx: 4096
  n_gpu_layers: -1
  temperature: 0.1
  max_tokens: 512

vector_db:
  provider: "chroma"
  collection_name: "qatm_documents"
  distance_metric: "cosine"
